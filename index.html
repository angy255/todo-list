<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sloth Rainforest To-Do List</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand&family=Patrick+Hand&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/66a5eab7b2.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>To-Do List 🦥</h1>

            <div class="taskButton">
                <input type="text" id="taskInput" placeholder="Don't forget to...">
                <button class="addTask"><i class="fa-solid fa-leaf"></i></button>
            </div>

            <div class="taskList">
                <ul id="taskList"></ul>
            </div>
            <div class="clearButtons">
                <button class="clearCompleted">Finally finished these!</button>
                <button class="clearAll">Clear all</button>
            </div>

    <!-- Sloth Reaction Image -->
            <div id="slothReaction" class="sloth-image"></div>
        
    </div>

    <script src="app.js"></script>
</body>
</html>
